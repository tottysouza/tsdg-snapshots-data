name: Generate Snapshots

# Roda diariamente 08:00 UTC = 05:00 BRT.
# GitHub Actions scheduled tem delay médio de 5-15 min (fica na fila),
# então efetivamente roda entre 05:05 e 05:20 BRT — ainda ~2h antes dos ciclos.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: # permite disparo manual pelo botão "Run workflow"

# Permite ao workflow fazer git push no próprio repo
permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run snapshot script
        run: node scripts/generate-snapshots.js

      - name: Commit snapshots
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "actions@github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: snapshots $(date -u +%Y-%m-%d)"
            git push
          fi
